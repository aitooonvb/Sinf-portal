<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出欠管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --primary: #2563eb;
  --primary-soft: #eff6ff;
  --present: #10b981;
  --present-soft: #ecfdf5;
  --absent: #ef4444;
  --absent-soft: #fef2f2;
  --late: #f59e0b;
  --late-soft: #fffbeb;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --radius: 16px;
  --shadow: 0 1px 8px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ヘッダー */
header{
  background:var(--primary);color:#fff;
  padding:0 20px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(37,99,235,0.3);
}
.header-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.02em;}
.header-date{font-size:13px;opacity:0.85;}

/* タブ */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:99;}
.tab{flex:1;padding:14px 0;text-align:center;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}

main{max-width:640px;margin:0 auto;padding:20px 16px 80px;}

/* セクションタイトル */
.sec-title{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:0.08em;text-transform:uppercase;margin:24px 0 10px 4px;}

/* パネル */
.panel{display:none;}.panel.active{display:block;}

/* 科目カード */
.subject-list{display:flex;flex-direction:column;gap:10px;}
.subject-card{
  background:var(--surface);border-radius:var(--radius);
  border:1.5px solid var(--border);
  padding:14px 16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:all 0.18s;
  display:flex;align-items:center;gap:14px;
}
.subject-card:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-lg);}
.subject-card.selected{border-color:var(--primary);background:var(--primary-soft);}
.subject-color{width:6px;height:48px;border-radius:4px;flex-shrink:0;}
.subject-info{flex:1;}
.subject-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.subject-meta{font-size:12px;color:var(--text-muted);}
.subject-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
.subject-card.selected .subject-check{background:var(--primary);border-color:var(--primary);}
.subject-card.selected .subject-check::after{content:'';width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}

/* 入力ボタン */
.record-section{margin-top:8px;}
.selected-subject-info{
  background:var(--primary-soft);border:1.5px solid var(--primary);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
}
.selected-label{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.selected-name{font-size:16px;font-weight:700;color:var(--text);}
.selected-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}

.att-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.att-btn{
  padding:18px 8px;border-radius:var(--radius);border:1.5px solid var(--border);
  cursor:pointer;text-align:center;font-family:'Noto Sans JP',sans-serif;
  font-size:15px;font-weight:700;background:var(--surface);
  transition:all 0.18s;
}
.att-btn:active{transform:scale(0.96);}
.att-btn .att-icon{font-size:28px;display:block;margin-bottom:6px;}
.att-btn .att-label{display:block;font-size:13px;}
.att-btn.present{border-color:var(--present);color:var(--present);background:var(--present-soft);}
.att-btn.present:hover{background:var(--present);color:#fff;}
.att-btn.absent{border-color:var(--absent);color:var(--absent);background:var(--absent-soft);}
.att-btn.absent:hover{background:var(--absent);color:#fff;}
.att-btn.late{border-color:var(--late);color:var(--late);background:var(--late-soft);}
.att-btn.late:hover{background:var(--late);color:#fff;}

/* メモ欄 */
.memo-row{display:flex;gap:8px;margin-bottom:8px;}
.memo-input{
  flex:1;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:10px;font-size:14px;font-family:inherit;
  color:var(--text);background:var(--surface);outline:none;
  transition:border-color 0.15s;
}
.memo-input:focus{border-color:var(--primary);}
.no-select{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;}

/* 履歴 */
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{
  background:var(--surface);border-radius:12px;
  border:1.5px solid var(--border);
  padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);
  animation:fadeIn 0.25s ease;
}
.status-badge{
  padding:4px 12px;border-radius:100px;font-size:12px;font-weight:700;flex-shrink:0;
}
.badge-present{background:var(--present-soft);color:var(--present);}
.badge-absent{background:var(--absent-soft);color:var(--absent);}
.badge-late{background:var(--late-soft);color:var(--late);}
.history-info{flex:1;}
.history-subject{font-size:14px;font-weight:700;}
.history-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.history-memo{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:2px;}
.del-btn{background:none;border:none;cursor:pointer;color:var(--border);font-size:18px;transition:color 0.15s;padding:0 4px;}
.del-btn:hover{color:var(--absent);}

/* 集計 */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:14px 10px;text-align:center;box-shadow:var(--shadow);}
.stat-num{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;}
.stat-num.present{color:var(--present);}
.stat-num.absent{color:var(--absent);}
.stat-num.late{color:var(--late);}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:4px;}

.rate-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:18px;box-shadow:var(--shadow);margin-bottom:20px;}
.rate-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.rate-title{font-size:14px;font-weight:700;}
.rate-num{font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;color:var(--primary);}
.rate-bar-bg{height:10px;background:var(--border);border-radius:5px;overflow:hidden;}
.rate-bar{height:10px;background:var(--primary);border-radius:5px;transition:width 0.5s ease;}

.subject-stats{display:flex;flex-direction:column;gap:8px;}
.subject-stat-row{
  background:var(--surface);border-radius:12px;border:1.5px solid var(--border);
  padding:12px 14px;box-shadow:var(--shadow);
}
.subject-stat-name{font-size:14px;font-weight:700;margin-bottom:8px;}
.subject-stat-counts{display:flex;gap:10px;font-size:12px;}
.count-item{display:flex;align-items:center;gap:4px;}
.count-dot{width:8px;height:8px;border-radius:50%;}
.dot-p{background:var(--present);}
.dot-a{background:var(--absent);}
.dot-l{background:var(--late);}
.mini-bar-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px;}
.mini-bar{height:6px;border-radius:3px;transition:width 0.5s;}

/* 科目設定 */
.setting-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.setting-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.setting-title{font-size:15px;font-weight:700;}
.add-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.add-btn:hover{background:#1d4ed8;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.form-full{grid-column:1/-1;}
.form-row label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:4px;}
.form-row input,.form-row select{
  width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);
  outline:none;transition:border-color 0.15s;
}
.form-row input:focus,.form-row select:focus{border-color:var(--primary);}
.subject-setting-list{display:flex;flex-direction:column;gap:8px;}
.subject-setting-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1.5px solid var(--border);border-radius:10px;background:var(--bg);
}
.sub-color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.sub-setting-info{flex:1;}
.sub-setting-name{font-size:14px;font-weight:600;}
.sub-setting-meta{font-size:12px;color:var(--text-muted);}
.sub-del{background:none;border:none;cursor:pointer;color:var(--border);font-size:16px;transition:color 0.15s;}
.sub-del:hover{color:var(--absent);}

/* トースト */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e293b;color:#fff;padding:12px 24px;border-radius:100px;
  font-size:14px;font-weight:600;z-index:999;
  transition:transform 0.3s ease,opacity 0.3s ease;opacity:0;pointer-events:none;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* カラー選択 */
.color-picker{display:flex;gap:8px;flex-wrap:wrap;}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.color-opt.selected{border-color:#0f172a;transform:scale(1.15);}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="./index.html" style="background:rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:18px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;text-decoration:none;" title="ホームに戻る">🏠</a>
    <div class="header-title">📋 出欠管理</div>
  </div>
  <div class="header-date" id="header-date"></div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('record')">入力</div>
  <div class="tab" onclick="switchTab('history')">履歴</div>
  <div class="tab" onclick="switchTab('stats')">集計</div>
  <div class="tab" onclick="switchTab('settings')">設定</div>
</div>

<main>

  <!-- 入力パネル -->
  <div class="panel active" id="panel-record">
    <div class="sec-title">科目を選択</div>
    <div class="subject-list" id="subject-list"></div>

    <div class="record-section" id="record-section" style="display:none;">
      <div class="sec-title">出欠を入力</div>
      <div id="change-notice-area"></div>
      <div class="selected-subject-info" id="selected-info"></div>
      <div class="att-buttons">
        <button class="att-btn present" onclick="record('present')">
          <span class="att-icon">✅</span>
          <span class="att-label">出席</span>
        </button>
        <button class="att-btn absent" onclick="record('absent')">
          <span class="att-icon">❌</span>
          <span class="att-label">欠席</span>
        </button>
        <button class="att-btn late" onclick="record('late')">
          <span class="att-icon">⏰</span>
          <span class="att-label">遅刻・早退</span>
        </button>
      </div>
      <div class="memo-row">
        <input class="memo-input" type="text" id="memo-input" placeholder="メモ（任意）">
      </div>
    </div>
  </div>

  <!-- 履歴パネル -->
  <div class="panel" id="panel-history">
    <div class="sec-title">記録一覧</div>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- 集計パネル -->
  <div class="panel" id="panel-stats">
    <div class="sec-title">全体集計</div>
    <div class="stats-grid" id="total-stats"></div>
    <div class="rate-card" id="rate-card"></div>
    <div class="sec-title">科目別</div>
    <div class="subject-stats" id="subject-stats"></div>
  </div>

  <!-- 設定パネル -->
  <div class="panel" id="panel-settings">
    <div class="sec-title">科目の管理</div>
    <div class="setting-card">
      <div class="setting-header">
        <div class="setting-title">科目一覧</div>
        <button class="add-btn" onclick="toggleAddSubject()">＋ 追加</button>
      </div>

      <div id="add-subject-form" style="display:none;border-top:1px solid var(--border);padding-top:14px;margin-bottom:14px;">
        <div class="form-grid">
          <div class="form-row form-full"><label>科目名</label><input type="text" id="f-name" placeholder="例：数学A"></div>
          <div class="form-row"><label>教室</label><input type="text" id="f-room" placeholder="例：101教室"></div>
          <div class="form-row"><label>担当教員</label><input type="text" id="f-teacher" placeholder="例：田中 先生"></div>
          <div class="form-row form-full"><label>曜日・時限</label><input type="text" id="f-time" placeholder="例：月曜 3限"></div>
          <div class="form-row form-full">
            <label>カラー</label>
            <div class="color-picker" id="color-picker"></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button style="background:none;border:1.5px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;" onclick="toggleAddSubject()">キャンセル</button>
          <button class="add-btn" onclick="addSubject()">追加する</button>
        </div>
      </div>

      <div class="subject-setting-list" id="subject-setting-list"></div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const COLORS = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#f97316'];
let selectedColor = COLORS[0];
let selectedSubjectId = null;

// ── localStorage キー定義（timetable.htmlと共通） ──
const LS_SUBJECTS = 'portal_subjects';
const LS_RECORDS  = 'portal_records';
const LS_META     = 'portal_meta';

const DEFAULT_SUBJECTS = [
  { id: 1, name: '線形代数学',          room: '大講義室A',   teacher: '山本 教授',   time: '月曜 1限', color: '#2563eb' },
  { id: 2, name: '微分積分学',          room: '202教室',     teacher: '鈴木 准教授', time: '火曜 2限', color: '#10b981' },
  { id: 3, name: '情報科学基礎',        room: '情報演習室1', teacher: '田中 助教',   time: '水曜 3限', color: '#8b5cf6' },
  { id: 4, name: '英語コミュニケーション', room: '305教室',  teacher: 'Smith 講師',  time: '木曜 4限', color: '#f59e0b' },
];

function loadData() {
  try {
    const raw = localStorage.getItem(LS_SUBJECTS);
    subjects = raw ? JSON.parse(raw) : DEFAULT_SUBJECTS;
  } catch(e) { subjects = DEFAULT_SUBJECTS; }
  try {
    const raw = localStorage.getItem(LS_RECORDS);
    records = raw ? JSON.parse(raw) : [];
  } catch(e) { records = []; }
  try {
    const raw = localStorage.getItem(LS_META);
    const meta = raw ? JSON.parse(raw) : {};
    nextSubId = meta.nextSubId || 10;
    nextRecId = meta.nextRecId || 1;
  } catch(e) { nextSubId = 10; nextRecId = 1; }
}

function saveSubjects() {
  localStorage.setItem(LS_SUBJECTS, JSON.stringify(subjects));
  localStorage.setItem(LS_META, JSON.stringify({ nextSubId, nextRecId }));
}

function saveRecords() {
  localStorage.setItem(LS_RECORDS, JSON.stringify(records));
  localStorage.setItem(LS_META, JSON.stringify({ nextSubId, nextRecId }));
}

let subjects = [];
let records = [];
let nextSubId = 10;
let nextRecId = 1;
loadData();

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['record','history','stats','settings'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if (tab === 'history') renderHistory();
  if (tab === 'stats') renderStats();
  if (tab === 'settings') renderSettings();
}

function renderSubjectList() {
  const el = document.getElementById('subject-list');
  if (!subjects.length) { el.innerHTML = '<div class="empty">科目がありません。「設定」から追加してください。</div>'; return; }
  el.innerHTML = subjects.map(s => `
    <div class="subject-card${selectedSubjectId === s.id ? ' selected' : ''}" onclick="selectSubject(${s.id})">
      <div class="subject-color" style="background:${s.color};"></div>
      <div class="subject-info">
        <div class="subject-name">${esc(s.name)}</div>
        <div class="subject-meta">${esc(s.room)}　${esc(s.teacher)}　${esc(s.time)}</div>
      </div>
      <div class="subject-check"></div>
    </div>`).join('');
}

function selectSubject(id) {
  selectedSubjectId = selectedSubjectId === id ? null : id;
  renderSubjectList();
  const sec = document.getElementById('record-section');
  if (selectedSubjectId) {
    const s = subjects.find(x => x.id === id);
    const todayRec = getTodayRecord(id);
    const statusLabels = { present: '出席', absent: '欠席', late: '遅刻・早退' };

    document.getElementById('selected-info').innerHTML = `
      <div class="selected-label">${todayRec ? '記録を変更' : '選択中の科目'}</div>
      <div class="selected-name">${esc(s.name)}</div>
      <div class="selected-meta">${esc(s.room)}　${esc(s.teacher)}　${esc(s.time)}</div>`;

    // 変更通知エリア更新
    const changeEl = document.getElementById('change-notice-area');
    changeEl.innerHTML = todayRec
      ? `<div class="change-notice">⚠️ 本日は「${statusLabels[todayRec.status]}」で記録済みです。変更する場合は下のボタンをタップしてください。</div>`
      : '';

    // メモ欄に既存メモを表示
    document.getElementById('memo-input').value = todayRec ? (todayRec.memo || '') : '';

    sec.style.display = 'block';
  } else {
    sec.style.display = 'none';
    document.getElementById('change-notice-area').innerHTML = '';
  }
}

function record(status) {
  if (!selectedSubjectId) return;
  const s = subjects.find(x => x.id === selectedSubjectId);
  const memo = document.getElementById('memo-input').value.trim();
  const today = getTodayStr();
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const labels = { present: '出席', absent: '欠席', late: '遅刻・早退' };

  const existingIdx = records.findIndex(r => r.subjectId === s.id && r.date === today);
  if (existingIdx !== -1) {
    records[existingIdx] = { ...records[existingIdx], status, time: timeStr, memo };
    showToast(`${s.name}：${labels[status]}に変更しました`);
  } else {
    records.unshift({ id: nextRecId++, subjectId: s.id, subjectName: s.name, status, date: today, time: timeStr, memo });
    showToast(`${s.name}：${labels[status]}を記録しました`);
  }

  document.getElementById('memo-input').value = '';
  const changeEl = document.getElementById('change-notice-area');
  const newRec = getTodayRecord(s.id);
  changeEl.innerHTML = `<div class="change-notice">⚠️ 本日は「${labels[newRec.status]}」で記録済みです。変更する場合は下のボタンをタップしてください。</div>`;
  renderSubjectList();
  saveRecords();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!records.length) { el.innerHTML = '<div class="empty">記録がありません</div>'; return; }
  const labels = { present: '出席', absent: '欠席', late: '遅刻・早退' };
  el.innerHTML = records.map(r => `
    <div class="history-item">
      <span class="status-badge badge-${r.status}">${labels[r.status]}</span>
      <div class="history-info">
        <div class="history-subject">${esc(r.subjectName)}</div>
        <div class="history-meta">${r.date}　${r.time}</div>
        ${r.memo ? `<div class="history-memo">${esc(r.memo)}</div>` : ''}
      </div>
      <button class="del-btn" onclick="deleteRecord(${r.id})">×</button>
    </div>`).join('');
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  saveRecords();
  renderHistory();
  showToast('記録を削除しました');
}

function renderStats() {
  const total = records.length;
  const present = records.filter(r => r.status === 'present').length;
  const absent = records.filter(r => r.status === 'absent').length;
  const late = records.filter(r => r.status === 'late').length;
  const rate = total > 0 ? Math.round((present / total) * 100) : 0;

  document.getElementById('total-stats').innerHTML = `
    <div class="stat-card"><div class="stat-num present">${present}</div><div class="stat-label">出席</div></div>
    <div class="stat-card"><div class="stat-num absent">${absent}</div><div class="stat-label">欠席</div></div>
    <div class="stat-card"><div class="stat-num late">${late}</div><div class="stat-label">遅刻・早退</div></div>`;

  document.getElementById('rate-card').innerHTML = `
    <div class="rate-header">
      <div class="rate-title">出席率（全科目）</div>
      <div class="rate-num">${rate}%</div>
    </div>
    <div class="rate-bar-bg"><div class="rate-bar" style="width:${rate}%;"></div></div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">全${total}回中 出席${present}回</div>`;

  const subStats = subjects.map(s => {
    const sr = records.filter(r => r.subjectId === s.id);
    const sp = sr.filter(r => r.status === 'present').length;
    const sa = sr.filter(r => r.status === 'absent').length;
    const sl = sr.filter(r => r.status === 'late').length;
    const sRate = sr.length > 0 ? Math.round((sp / sr.length) * 100) : 0;
    return { s, sp, sa, sl, sRate, total: sr.length };
  });

  const el = document.getElementById('subject-stats');
  if (!subStats.some(x => x.total > 0)) { el.innerHTML = '<div class="empty">記録がありません</div>'; return; }
  el.innerHTML = subStats.filter(x => x.total > 0).map(x => `
    <div class="subject-stat-row">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <div style="width:10px;height:10px;border-radius:50%;background:${x.s.color};flex-shrink:0;"></div>
        <div class="subject-stat-name">${esc(x.s.name)}</div>
        <div style="margin-left:auto;font-size:13px;font-weight:700;color:var(--primary);">${x.sRate}%</div>
      </div>
      <div class="subject-stat-counts">
        <span class="count-item"><span class="count-dot dot-p"></span>出席 ${x.sp}</span>
        <span class="count-item"><span class="count-dot dot-a"></span>欠席 ${x.sa}</span>
        <span class="count-item"><span class="count-dot dot-l"></span>遅刻 ${x.sl}</span>
        <span style="margin-left:auto;font-size:12px;color:var(--text-muted);">全${x.total}回</span>
      </div>
      <div class="mini-bar-bg"><div class="mini-bar" style="width:${x.sRate}%;background:${x.s.color};"></div></div>
    </div>`).join('');
}

function renderSettings() {
  renderSubjectSettingList();
  renderColorPicker();
}

function renderSubjectSettingList() {
  const el = document.getElementById('subject-setting-list');
  if (!subjects.length) { el.innerHTML = '<div class="empty">科目がありません</div>'; return; }
  el.innerHTML = subjects.map(s => `
    <div class="subject-setting-item">
      <div class="sub-color-dot" style="background:${s.color};"></div>
      <div class="sub-setting-info">
        <div class="sub-setting-name">${esc(s.name)}</div>
        <div class="sub-setting-meta">${esc(s.room)}　${esc(s.teacher)}　${esc(s.time)}</div>
      </div>
      <button class="sub-del" onclick="deleteSubject(${s.id})">×</button>
    </div>`).join('');
}

function renderColorPicker() {
  document.getElementById('color-picker').innerHTML = COLORS.map(c => `
    <div class="color-opt${c === selectedColor ? ' selected' : ''}"
      style="background:${c};" onclick="pickColor('${c}')"></div>`).join('');
}

function pickColor(c) {
  selectedColor = c;
  renderColorPicker();
}

function toggleAddSubject() {
  const f = document.getElementById('add-subject-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

function addSubject() {
  const name = document.getElementById('f-name').value.trim();
  const room = document.getElementById('f-room').value.trim();
  const teacher = document.getElementById('f-teacher').value.trim();
  const time = document.getElementById('f-time').value.trim();
  if (!name) { showToast('科目名を入力してください'); return; }
  subjects.push({ id: nextSubId++, name, room: room||'未設定', teacher: teacher||'未設定', time: time||'未設定', color: selectedColor });
  ['f-name','f-room','f-teacher','f-time'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('add-subject-form').style.display = 'none';
  saveSubjects();
  renderSubjectSettingList();
  renderSubjectList();
  showToast(`「${name}」を追加しました`);
}

function deleteSubject(id) {
  const s = subjects.find(x => x.id === id);
  subjects = subjects.filter(x => x.id !== id);
  if (selectedSubjectId === id) { selectedSubjectId = null; document.getElementById('record-section').style.display = 'none'; }
  saveSubjects();
  renderSubjectSettingList();
  renderSubjectList();
  showToast(`「${s.name}」を削除しました`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 日付表示
const d = new Date();
const days = ['日','月','火','水','木','金','土'];
document.getElementById('header-date').textContent =
  `${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;

renderSubjectList();
renderColorPicker();
</script>
</body>
</html>
