<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校ポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ▼ PWA用の設定 ここから -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a4fa0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学校ポータル">
<link rel="apple-touch-icon" href="icon.png">
<!-- ▲ PWA用の設定 ここまで -->
<style>
  :root {
    --primary: #1a4fa0;
    --primary-light: #2563cc;
    --primary-soft: #e8effe;
    --accent: #f59e0b;
    --accent-soft: #fef3c7;
    --success: #10b981;
    --danger: #ef4444;
    --bg: #f0f4f8;
    --surface: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(26,79,160,0.08);
    --shadow-lg: 0 8px 32px rgba(26,79,160,0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ヘッダー */
  header {
    background: var(--primary);
    color: #fff;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(26,79,160,0.25);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .school-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .school-name { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .notif-bell {
    position: relative; cursor: pointer;
    background: rgba(255,255,255,0.15);
    border: none; border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff; transition: background 0.2s;
  }
  .notif-bell:hover { background: rgba(255,255,255,0.28); }
  .notif-badge {
    position: absolute; top: 4px; right: 4px;
    background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700;
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--primary);
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
    cursor: pointer;
  }

  /* メインレイアウト */
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }

  /* ご挨拶 */
  .greeting {
    margin-bottom: 24px;
  }
  .greeting h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .greeting p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

  /* セクション */
  .section-title {
    font-size: 13px; font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* クイックアクセス */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .quick-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 12px 14px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    transition: all 0.18s;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .quick-btn::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--btn-color, var(--primary));
    border-radius: 3px 3px 0 0;
  }
  .quick-btn:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--btn-color, var(--primary));
  }
  .quick-btn:active { transform: translateY(-1px); }
  .btn-icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: var(--btn-soft, var(--primary-soft));
  }
  .btn-label { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .btn-sub { font-size: 11px; color: var(--text-muted); }

  /* 管理ボタン */
  .manage-row {
    display: flex; gap: 10px;
    margin-bottom: 12px;
  }
  .manage-btn {
    background: var(--primary-soft);
    border: 1.5px solid var(--primary);
    color: var(--primary);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .manage-btn:hover { background: var(--primary); color: #fff; }

  /* お知らせ */
  .notice-panel {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 32px;
  }
  .notice-item {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
    animation: fadeIn 0.3s ease both;
  }
  .notice-item:last-child { border-bottom: none; }
  .notice-item:hover { background: var(--primary-soft); }
  .notice-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 6px; flex-shrink: 0;
  }
  .dot-new { background: var(--primary); }
  .dot-read { background: var(--border); }
  .notice-content { flex: 1; }
  .notice-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .notice-title.read { font-weight: 400; color: var(--text-muted); }
  .notice-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; }
  .notice-tag {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 100px;
    flex-shrink: 0; align-self: center;
  }
  .tag-info { background: var(--primary-soft); color: var(--primary); }
  .tag-urgent { background: #fee2e2; color: var(--danger); }
  .tag-event { background: var(--accent-soft); color: #b45309; }

  /* フラグ */
  .flag-icon { font-size: 16px; cursor: pointer; flex-shrink: 0; align-self: center; transition: transform 0.15s; }
  .flag-icon:hover { transform: scale(1.2); }

  /* お知らせアクションボタン（詳細モーダル内） */
  .notice-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--border); }
  .notice-action-btn {
    padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--bg); color: var(--text); font-family: inherit; transition: all 0.15s;
  }
  .notice-action-btn:hover { border-color: var(--primary); color: var(--primary); }
  .notice-action-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* フラグ選択パネル */
  .flag-picker { display: flex; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .flag-picker-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .flag-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: all 0.15s; }
  .flag-opt:hover { transform: scale(1.15); }
  .flag-opt.selected { border-color: #333; transform: scale(1.2); }

  /* 確認ダイアログ */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: var(--surface); border-radius: var(--radius); max-width: 400px; width: 100%; padding: 24px; box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease; }
  .confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .confirm-body { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-cancel { padding: 9px 18px; border: 1.5px solid var(--border); border-radius: 8px; background: none; cursor: pointer; font-size: 14px; font-family: inherit; }
  .confirm-ok { padding: 9px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; font-family: inherit; }

  /* フィルターバー */
  .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filter-chip { padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted); transition: all 0.15s; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ローディング */
  .loading { text-align: center; padding: 24px; color: var(--text-muted); font-size: 14px; }

  /* お知らせ詳細モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 200;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    max-width: 520px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.22s ease;
  }
  .modal-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close {
    background: none; border: none; font-size: 22px;
    cursor: pointer; color: var(--text-muted);
    line-height: 1; flex-shrink: 0;
  }
  .modal-body { padding: 18px 20px; font-size: 14px; line-height: 1.8; color: var(--text); }
  .modal-meta { font-size: 12px; color: var(--text-muted); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* お知らせ追加フォーム */
  .add-form {
    display: none;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1.5px solid var(--primary);
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.2s ease;
  }
  .add-form.open { display: block; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%; padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px;
    font-family: inherit; color: var(--text);
    background: var(--bg);
    outline: none; transition: border-color 0.15s;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
    border-color: var(--primary);
  }
  .form-row textarea { resize: vertical; min-height: 80px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-post {
    background: var(--primary); color: #fff;
    border: none; border-radius: 8px;
    padding: 9px 20px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-post:hover { background: var(--primary-light); }
  .btn-cancel {
    background: none; border: 1.5px solid var(--border);
    border-radius: 8px; padding: 9px 16px;
    font-size: 14px; cursor: pointer; color: var(--text-muted);
    transition: border-color 0.15s;
  }
  .btn-cancel:hover { border-color: var(--text-muted); }

  /* リンク管理モーダル */
  .link-modal {
    background: var(--surface);
    border-radius: var(--radius);
    max-width: 480px; width: 100%;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.22s ease;
    max-height: 80vh; overflow-y: auto;
  }

  /* アニメーション */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  /* 空状態 */
  .empty { text-align: center; padding: 32px 20px; color: var(--text-muted); font-size: 14px; }

  /* レスポンシブ */
  @media (max-width: 480px) {
    .quick-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn-icon { width: 38px; height: 38px; font-size: 18px; }
    .btn-label { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="school-icon">🏫</div>
    <span class="school-name">学校ポータル</span>
  </div>
  <div class="header-right">
    <button class="notif-bell" onclick="scrollToNotices()" title="お知らせ">
      🔔
      <span class="notif-badge" id="badge">0</span>
    </button>
    <div class="avatar" title="山田 先生">山</div>
  </div>
</header>

<main>
  <div class="greeting">
    <h1>おはようございます、山田先生 👋</h1>
    <p id="today-date"></p>
  </div>

  <!-- クイックアクセス -->
  <div class="section-title">クイックアクセス</div>
  <div class="manage-row">
    <button class="manage-btn" onclick="openLinkManager()">＋ リンクを編集</button>
  </div>
  <div class="quick-grid" id="quick-grid"></div>

  <!-- お知らせ -->
  <div class="section-title" id="notices-section">お知らせ</div>
  <div class="manage-row">
    <button class="manage-btn" onclick="toggleAddForm()">＋ お知らせを投稿</button>
    <button class="manage-btn" onclick="markAllRead()">すべて既読にする</button>
  </div>

  <div class="add-form" id="add-form">
    <div class="form-row">
      <label>タイトル</label>
      <input type="text" id="new-title" placeholder="お知らせのタイトル">
    </div>
    <div class="form-row">
      <label>本文</label>
      <textarea id="new-body" placeholder="内容を入力してください..."></textarea>
    </div>
    <div class="form-row">
      <label>カテゴリ</label>
      <select id="new-tag">
        <option value="info">お知らせ</option>
        <option value="urgent">緊急</option>
        <option value="event">行事</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="toggleAddForm()">キャンセル</button>
      <button class="btn-post" onclick="confirmPost()">投稿する</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-chip active" onclick="setFilter('all',this)">すべて</div>
    <div class="filter-chip" onclick="setFilter('unread',this)">未読</div>
    <div class="filter-chip" onclick="setFilter('flagged',this)">🚩 フラグ</div>
    <div class="filter-chip" onclick="setFilter('info',this)">お知らせ</div>
    <div class="filter-chip" onclick="setFilter('urgent',this)">緊急</div>
    <div class="filter-chip" onclick="setFilter('event',this)">行事</div>
  </div>

  <div class="notice-panel" id="notice-panel"><div class="loading">読み込み中...</div></div>
</main>

<!-- お知らせ詳細モーダル -->
<div class="modal-overlay" id="notice-modal" onclick="closeNoticeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeNoticeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="notice-actions" id="modal-actions"></div>
    <div class="flag-picker" id="flag-picker" style="display:none;">
      <span class="flag-picker-label">フラグの色：</span>
      <div class="flag-opt" style="background:#ef4444;" data-flag="red" onclick="setFlag('red')"></div>
      <div class="flag-opt" style="background:#f59e0b;" data-flag="orange" onclick="setFlag('orange')"></div>
      <div class="flag-opt" style="background:#10b981;" data-flag="green" onclick="setFlag('green')"></div>
      <div class="flag-opt" style="background:#3b82f6;" data-flag="blue" onclick="setFlag('blue')"></div>
      <div class="flag-opt" style="background:#8b5cf6;" data-flag="purple" onclick="setFlag('purple')"></div>
      <div class="flag-opt" style="background:#e2e8f0;" data-flag="" onclick="setFlag('')" title="フラグを外す">✕</div>
    </div>
  </div>
</div>

<!-- 投稿確認ダイアログ -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">📢 お知らせを投稿しますか？</div>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">キャンセル</button>
      <button class="confirm-ok" onclick="postNotice()">投稿する</button>
    </div>
  </div>
</div>

<!-- リンク管理モーダル -->
<div class="modal-overlay" id="link-modal" onclick="closeModal('link-modal')">
  <div class="link-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">リンクを編集</div>
      <button class="modal-close" onclick="closeModal('link-modal')">×</button>
    </div>
    <div class="modal-body">
      <div id="link-list" style="margin-bottom:16px;"></div>
      <div style="border-top:1px solid var(--border);padding-top:14px;">
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:10px;">新しいリンクを追加</div>
        <div class="form-row"><label>ラベル名</label><input type="text" id="new-link-label" placeholder="例：Google Classroom"></div>
        <div class="form-row"><label>URL</label><input type="text" id="new-link-url" placeholder="https://..."></div>
        <div class="form-row"><label>アイコン（絵文字）</label><input type="text" id="new-link-icon" placeholder="📚" maxlength="2"></div>
        <div class="form-actions"><button class="btn-post" onclick="addLink()">追加する</button></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase 初期化 ──
const firebaseConfig = {
  apiKey: "AIzaSyAjETeJffVrzn2KPE0SP4sEazeycWT1iGY",
  authDomain: "school-portal-5a76c.firebaseapp.com",
  projectId: "school-portal-5a76c",
  storageBucket: "school-portal-5a76c.firebasestorage.app",

  appId: "1:769151131409:web:8609238bca82fb1938f6b0"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── 既読・フラグはlocalStorageで端末ごとに管理 ──
const LS_READ    = 'portal_notice_read';    // Set<docId>
const LS_FLAGS   = 'portal_notice_flags';   // {docId: 'red'|'orange'|...}

function getReadSet()  { try { return new Set(JSON.parse(localStorage.getItem(LS_READ)  || '[]')); } catch(e){ return new Set(); } }
function getFlagMap()  { try { return JSON.parse(localStorage.getItem(LS_FLAGS) || '{}'); } catch(e){ return {}; } }
function saveRead(s)   { localStorage.setItem(LS_READ,  JSON.stringify([...s])); }
function saveFlags(m)  { localStorage.setItem(LS_FLAGS, JSON.stringify(m)); }

const FLAG_COLORS = {
  red:    '#ef4444',
  orange: '#f59e0b',
  green:  '#10b981',
  blue:   '#3b82f6',
  purple: '#8b5cf6',
};

// ── クイックアクセス ──
const COLORS = [
  { color: '#1a4fa0', soft: '#e8effe' },
  { color: '#10b981', soft: '#d1fae5' },
  { color: '#f59e0b', soft: '#fef3c7' },
  { color: '#ef4444', soft: '#fee2e2' },
  { color: '#8b5cf6', soft: '#ede9fe' },
  { color: '#06b6d4', soft: '#cffafe' },
];
let links = [
  { id: 1, label: 'Moodle',          url: 'https://md.kumamoto-u.ac.jp/my/', icon: '📚', locked: true },
  { id: 2, label: 'SOSEKI',          url: 'https://casoseki.kumamoto-u.ac.jp/campusweb/portal.do?page=main', icon: '🖥️', locked: true },
  { id: 3, label: '教科書検索システム', url: 'https://www.kyushuba-univcoop.jp/textbook/kumamoto-u/', icon: '📖', locked: true },
  { id: 4, label: '出欠管理',         url: './attendance.html', icon: '✅', locked: true },
  { id: 5, label: '時間割',           url: './timetable.html',  icon: '📅', locked: true },
  { id: 6, label: 'メール',           url: 'https://mail.google.com', icon: '✉️' },
];
let nextLinkId = 10;

function renderQuickGrid() {
  const grid = document.getElementById('quick-grid');
  grid.innerHTML = links.map((l, i) => {
    const c = COLORS[i % COLORS.length];
    return `<a class="quick-btn" href="${l.url}" target="_blank" rel="noopener"
      style="--btn-color:${c.color};--btn-soft:${c.soft};">
      <div class="btn-icon">${l.icon}</div>
      <span class="btn-label">${l.label}</span>
    </a>`;
  }).join('');
}

// ── お知らせ ──
let allNotices = [];   // Firestoreから取得した全件
let currentFilter = 'all';
let activeNoticeId = null; // 詳細表示中のdocId

// Firestoreをリアルタイム購読
const noticesCol = collection(db, 'notices');
const noticesQuery = query(noticesCol, orderBy('createdAt', 'desc'));
onSnapshot(noticesQuery, (snapshot) => {
  allNotices = snapshot.docs.map(d => ({ docId: d.id, ...d.data() }));
  renderNotices();
  updateBadge();
});

function renderNotices() {
  const panel = document.getElementById('notice-panel');
  const readSet  = getReadSet();
  const flagMap  = getFlagMap();
  const tagMap   = { info: ['tag-info','お知らせ'], urgent: ['tag-urgent','緊急'], event: ['tag-event','行事'] };

  let filtered = allNotices.filter(n => {
    if (currentFilter === 'unread')  return !readSet.has(n.docId);
    if (currentFilter === 'flagged') return !!flagMap[n.docId];
    if (['info','urgent','event'].includes(currentFilter)) return n.tag === currentFilter;
    return true;
  });

  if (!filtered.length) {
    panel.innerHTML = '<div class="empty">お知らせはありません</div>';
    return;
  }

  panel.innerHTML = filtered.map(n => {
    const isRead = readSet.has(n.docId);
    const flag   = flagMap[n.docId];
    const [cls, label] = tagMap[n.tag] || tagMap.info;
    const flagHtml = flag
      ? `<span class="flag-icon" style="color:${FLAG_COLORS[flag]};" onclick="event.stopPropagation();openFlag('${n.docId}')">🚩</span>`
      : `<span class="flag-icon" style="opacity:0.2;" onclick="event.stopPropagation();openFlag('${n.docId}')">🚩</span>`;
    const dateStr = n.createdAt ? new Date(n.createdAt.toDate()).toLocaleDateString('ja-JP') : n.date || '';
    return `<div class="notice-item" onclick="openNotice('${n.docId}')">
      <div class="notice-dot ${isRead ? 'dot-read' : 'dot-new'}"></div>
      <div class="notice-content">
        <div class="notice-title${isRead ? ' read' : ''}">${esc(n.title)}</div>
        <div class="notice-meta"><span>${dateStr}</span><span>${esc(n.poster||'')}</span></div>
      </div>
      ${flagHtml}
      <span class="notice-tag ${cls}">${label}</span>
    </div>`;
  }).join('');
}

function updateBadge() {
  const readSet = getReadSet();
  const cnt = allNotices.filter(n => !readSet.has(n.docId)).length;
  const badge = document.getElementById('badge');
  badge.textContent = cnt;
  badge.style.display = cnt > 0 ? 'flex' : 'none';
}

window.openNotice = function(docId) {
  const n = allNotices.find(x => x.docId === docId);
  if (!n) return;
  activeNoticeId = docId;

  // 既読にする
  const readSet = getReadSet();
  readSet.add(docId);
  saveRead(readSet);
  renderNotices();
  updateBadge();

  const flagMap  = getFlagMap();
  const flag     = flagMap[docId];
  const dateStr  = n.createdAt ? new Date(n.createdAt.toDate()).toLocaleDateString('ja-JP') : n.date || '';
  const tagNames = { info:'お知らせ', urgent:'緊急', event:'行事' };

  document.getElementById('modal-title').textContent = n.title;
  document.getElementById('modal-body').innerHTML =
    `<p>${esc(n.body||'')}</p>
     <div class="modal-meta">${dateStr}　カテゴリ：${tagNames[n.tag]||''}　投稿者：${esc(n.poster||'不明')}</div>`;

  // アクションボタン
  document.getElementById('modal-actions').innerHTML = `
    <button class="notice-action-btn" onclick="markUnread('${docId}')">未読に戻す</button>
    <button class="notice-action-btn" onclick="toggleFlagPicker()">🚩 フラグ</button>
  `;

  // フラグピッカー初期状態
  const picker = document.getElementById('flag-picker');
  picker.style.display = 'none';
  document.querySelectorAll('.flag-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.flag === (flag||''));
  });

  document.getElementById('notice-modal').classList.add('open');
};

window.closeNoticeModal = function() {
  document.getElementById('notice-modal').classList.remove('open');
  document.getElementById('flag-picker').style.display = 'none';
  activeNoticeId = null;
};

window.markUnread = function(docId) {
  const readSet = getReadSet();
  readSet.delete(docId);
  saveRead(readSet);
  renderNotices();
  updateBadge();
  closeNoticeModal();
};

window.toggleFlagPicker = function() {
  const p = document.getElementById('flag-picker');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
};

window.openFlag = function(docId) {
  activeNoticeId = docId;
  const flagMap = getFlagMap();
  const flag = flagMap[docId] || '';
  document.querySelectorAll('.flag-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.flag === flag);
  });
  const picker = document.getElementById('flag-picker');
  picker.style.display = 'flex';
  // モーダルを開く
  openNotice(docId);
};

window.setFlag = function(color) {
  if (!activeNoticeId) return;
  const flagMap = getFlagMap();
  if (color) flagMap[activeNoticeId] = color;
  else delete flagMap[activeNoticeId];
  saveFlags(flagMap);
  document.querySelectorAll('.flag-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.flag === color);
  });
  renderNotices();
};

window.setFilter = function(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderNotices();
};

window.markAllRead = function() {
  const readSet = getReadSet();
  allNotices.forEach(n => readSet.add(n.docId));
  saveRead(readSet);
  renderNotices();
  updateBadge();
};

// ── 投稿確認ダイアログ ──
window.confirmPost = function() {
  const title = document.getElementById('new-title').value.trim();
  const body  = document.getElementById('new-body').value.trim();
  const tag   = document.getElementById('new-tag').value;
  if (!title) { alert('タイトルを入力してください'); return; }
  const tagNames = { info:'お知らせ', urgent:'緊急', event:'行事' };
  document.getElementById('confirm-body').innerHTML =
    `<strong>「${esc(title)}」</strong><br>カテゴリ：${tagNames[tag]}<br>${body ? `内容：${esc(body.slice(0,60))}${body.length>60?'…':''}` : ''}`;
  document.getElementById('confirm-overlay').classList.add('open');
};

window.closeConfirm = function() {
  document.getElementById('confirm-overlay').classList.remove('open');
};

window.postNotice = async function() {
  const title = document.getElementById('new-title').value.trim();
  const body  = document.getElementById('new-body').value.trim();
  const tag   = document.getElementById('new-tag').value;
  if (!title) return;
  try {
    await addDoc(noticesCol, {
      title,
      body: body || '（本文なし）',
      tag,
      poster: '利用者',
      createdAt: serverTimestamp(),
    });
    document.getElementById('new-title').value = '';
    document.getElementById('new-body').value  = '';
    document.getElementById('add-form').classList.remove('open');
    document.getElementById('confirm-overlay').classList.remove('open');
  } catch(e) {
    alert('投稿に失敗しました。ネットワークを確認してください。');
    console.error(e);
  }
};

window.toggleAddForm = function() {
  document.getElementById('add-form').classList.toggle('open');
};

window.scrollToNotices = function() {
  document.getElementById('notices-section').scrollIntoView({ behavior: 'smooth' });
};

// ── リンク管理 ──
window.openLinkManager = function() {
  renderLinkList();
  document.getElementById('link-modal').classList.add('open');
};
window.closeModal = function(id) {
  document.getElementById(id).classList.remove('open');
};

function renderLinkList() {
  const el = document.getElementById('link-list');
  if (!links.length) { el.innerHTML = '<div class="empty">リンクがありません</div>'; return; }
  el.innerHTML = links.map(l => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:20px;">${l.icon}</span>
      <span style="flex:1;font-size:14px;font-weight:500;">${l.label}</span>
      ${l.locked
        ? `<span style="font-size:13px;color:var(--text-muted);padding:0 6px;" title="このリンクは削除できません">🔒</span>`
        : `<button onclick="removeLink(${l.id})" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:18px;">×</button>`
      }
    </div>`).join('');
}
window.removeLink = function(id) {
  const link = links.find(l => l.id === id);
  if (link && link.locked) return;
  links = links.filter(l => l.id !== id);
  renderLinkList(); renderQuickGrid();
};
window.addLink = function() {
  const label = document.getElementById('new-link-label').value.trim();
  const url   = document.getElementById('new-link-url').value.trim();
  const icon  = document.getElementById('new-link-icon').value.trim() || '🔗';
  if (!label || !url) { alert('ラベルとURLを入力してください'); return; }
  const fullUrl = url.startsWith('http') ? url : 'https://' + url;
  links.push({ id: nextLinkId++, label, url: fullUrl, icon });
  document.getElementById('new-link-label').value = '';
  document.getElementById('new-link-url').value   = '';
  document.getElementById('new-link-icon').value  = '';
  renderLinkList(); renderQuickGrid();
};

// ── ユーティリティ ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 日付表示 ──
const d = new Date();
const days = ['日','月','火','水','木','金','土'];
document.getElementById('today-date').textContent =
  `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;

renderQuickGrid();
</script>
